image: atlassian/default-image:5
clone:
  depth: full
pipelines:
  branches:
    develop:
      - step:
          name: Node Installation
          deployment: staging
          caches:
            - node
          script:
            - npm install --legacy-peer-deps
          artifacts:
            - node_modules/**
      - parallel:
          - step:
              name: Deploy Customer
              script:
                - npx nx run customer:build
                - rm .gitignore
                - git rm -r apps libs
                - mv dist/apps/customer/browser custom-app/
                - git add custom-app
                - git commit -m "commit the build result"
                - git remote add staging dokku@test.healbridge.app:customer
                - git push staging develop --force
                - ssh dokku@test.healbridge.app cleanup
          - step:
              name: Deploy Medical Facility
              script:
                - npx nx run medical-facility:build
                - rm .gitignore
                - git rm -r apps libs
