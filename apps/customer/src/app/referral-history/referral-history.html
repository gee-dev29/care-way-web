<ion-content id="background-content" fullscreen>
  @if (loaded) {

  <div class="page-header">
    <ion-icon src="/logo/backarrow.svg" (click)="goBack()"></ion-icon>
    <h2>Referral History</h2>
  </div>

  <div class="referral-list">
    @for (user of users; track user.userId) {
    <div class="referral-card">
      <div class="row">
        <span class="label">Name</span>
      </div>

      <div class="row value">
        <span>
          {{ user.firstName | titlecase }} {{ user.lastName | titlecase }}
        </span>
      </div>
    </div>
    }
  </div>

  } @else {

  <!-- Skeleton Loading -->
  <div class="page-header">
    <ion-skeleton-text
      animated
      style="width: 40px; height: 20px"
    ></ion-skeleton-text>
    <ion-skeleton-text
      animated
      style="width: 140px; height: 20px"
    ></ion-skeleton-text>
  </div>

  <div class="referral-list">
    @for (i of [1,2]; track $index) {
    <div class="referral-card">
      <div class="row">
        <ion-skeleton-text
          animated
          style="width: 90px; height: 16px"
        ></ion-skeleton-text>
      </div>

      <div class="row value">
        <ion-skeleton-text
          animated
          style="width: 150px; height: 18px"
        ></ion-skeleton-text>
      </div>
    </div>
    }
  </div>

  }
</ion-content>
