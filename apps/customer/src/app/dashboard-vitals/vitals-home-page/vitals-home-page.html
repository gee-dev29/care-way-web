<ion-content id="background-content" fullscreen>
  <div id="prescription" class="ion-padding">
    <div class="header">
      <a routerLink="/dashboard/home">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </a>
      <div class="title">Vitals</div>
    </div>

    @if (isLoading) { @for (item of items; track item.title) {
    <app-health-card
      [icon]="item.icon"
      [title]="item.title"
      [subtitle]="item.subtitle$ ? (item.subtitle$ | async) : item.subtitle"
      [statusColor]="item.statusColor"
      [statusText]="item.statusText"
      [navigate]="item.url"
      style="--icon-bg: {{ item.bg }}"
    ></app-health-card>
    }
    <ion-card class="symptoms-card" (click)="symptoms()">
      <div class="plus-icon">+</div>
      <div class="text">
        <div class="title">Symptoms</div>
        <div class="subtitle">Describe how you feel today.</div>
      </div>
    </ion-card>
    } @else { @for (item of items; track item) {
    <ion-card class="health-card">
      <div class="icon-container">
        <ion-skeleton-text animated style="width: 40px; height: 40px">
        </ion-skeleton-text>
      </div>
      <div class="text-container">
        <ion-skeleton-text animated style="width: 60%; height: 18px">
        </ion-skeleton-text>
        <ion-skeleton-text
          animated
          style="width: 40%; height: 14px; margin-top: 8px"
        >
        </ion-skeleton-text>
        <ion-skeleton-text
          animated
          style="width: 30%; height: 14px; margin-top: 10px"
        >
        </ion-skeleton-text>
      </div>
    </ion-card>
    }
    <ion-card class="symptoms-card">
      <div class="plus-icon">
        <ion-skeleton-text
          animated
          style="width: 20px; height: 20px; border-radius: 50%"
        >
        </ion-skeleton-text>
      </div>
      <div class="text">
        <ion-skeleton-text animated style="width: 40%; height: 18px">
        </ion-skeleton-text>
        <ion-skeleton-text
          animated
          style="width: 70%; height: 14px; margin-top: 6px"
        >
        </ion-skeleton-text>
      </div>
    </ion-card>
    }
  </div>
</ion-content>
