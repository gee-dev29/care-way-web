<ion-content id="background-content" fullscreen>
  <div id="prescription" class="ion-padding">
    <ion-header class="ion-no-border">
      <div class="left-toolbar">
        <ion-icon src="/logo/backarrow.svg" (click)="navigateTo()"></ion-icon>

        <ion-text>Symptoms Details</ion-text>
      </div>

      <div class="card">
        @if (( symtomsSummary$ | async); as summary) {
        <div class="row">
          <span class="label">Date:</span>
          <span class="value">{{formatDateorTime(summary?.date)}}</span>
        </div>

        <div class="divider"></div>

        <div class="row">
          <span class="label">Time:</span>
          <span class="value">{{formatDateorTime(summary?.time)}}</span>
        </div>

        <div class="divider"></div>

        <div class="row">
          <span class="label">Name:</span>
          <span class="value">{{summary?.memberName}}</span>
        </div>

        <div class="divider"></div>

        <div class="section">
          <span class="label">Presenting Complaints</span>
          <p class="complaint">{{summary?.notes}}</p>
        </div>
        } @else {
        <!-- ⏳ SKELETON LOADER -->
        <div class="row">
          <ion-skeleton-text animated style="width: 40%"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 50%"></ion-skeleton-text>
        </div>

        <div class="divider"></div>

        <div class="row">
          <ion-skeleton-text animated style="width: 40%"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 35%"></ion-skeleton-text>
        </div>

        <div class="divider"></div>

        <div class="row">
          <ion-skeleton-text animated style="width: 40%"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
        </div>

        <div class="divider"></div>

        <div class="section">
          <ion-skeleton-text
            animated
            style="width: 60%; height: 16px"
          ></ion-skeleton-text>

          <ion-skeleton-text animated style="width: 100%"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 95%"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 90%"></ion-skeleton-text>
        </div>
        }
      </div>

      <div class="card">
        <div class="row">
          <div class="icon-row">
            <div class="icon">
              <ion-icon name="document-text-outline"></ion-icon>
            </div>
            <span>Appointment Fee</span>
          </div>
          <span class="amount">₦10,000.00</span>
        </div>
        <div class="divider"></div>

        <div class="row">
          <div class="icon-row">
            <div class="icon">
              <ion-icon name="receipt-outline"></ion-icon>
            </div>
            <span>Service Charge</span>
          </div>
          <span class="amount">₦500.00</span>
        </div>

        <div class="divider"></div>

        <div class="row total">
          <span>Total</span>
          <span>₦10,500.00</span>
        </div>
      </div>

      <div class="btn-container">
        <ui-button
          [label]="'Pay'"
          [width]="'full'"
          [fill]="'solid'"
          [shape]="'round'"
          [backgroundColor]="'#307d3d'"
          [textColor]="'#FDFDFD'"
          (Click)="continue()"
        ></ui-button>
      </div>
    </ion-header>
  </div>
</ion-content>
