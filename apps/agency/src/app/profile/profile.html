<ion-content class="profile-content">
  <!-- <ion-header id="prescription"> -->
  <div class="up">
    <ion-icon
      (click)="back()"
      name="chevron-back-outline"
      size="small"
    ></ion-icon>
    <ion-text class="title" color="black">Profile</ion-text>
  </div>
  <!-- </ion-header> -->

  <div tabindex="" (keyup)="upload()" (click)="upload()" class="avatar-wrapper">
    @if (profileInfoService?.picture!==null) {
    <div class="avatar-border">
      <ion-img class="avatar" [src]="profileInfoService?.picture"> </ion-img>
    </div>
    } @else {
    <ion-avatar class="avatar-border text__avater">
      <span
        >{{profileInfoService.name[0]}} {{profileInfoService.name.split('
        ')[1][0]}}
      </span>
    </ion-avatar>
    }
    <div class="profile__details">
      <div class="name">{{profileInfoService?.name}}</div>
      <div class="verified__name">{{profileInfoService?.email}}</div>
      <div class="verified">Verified</div>
    </div>
  </div>

  <div class="menu-list">
    <div
      class="menu-row"
      tabindex="0"
      (keydown.enter)="goTo('personal-info')"
      (click)="goTo('personal-info')"
    >
      <div class="right">
        <ion-icon src="/logo/profile-icon.svg"></ion-icon>
        <span>Personal</span>
      </div>
      <ion-icon class="end-icon" name="chevron-forward-outline"></ion-icon>
    </div>

    <div
      class="menu-row"
      tabindex="0"
      (keydown.enter)="goTo('bank-account')"
      (click)="goTo('bank-account')"
    >
      <div class="right">
        <ion-icon src="/logo/profile-icon.svg"></ion-icon>
        <span>Bank Account</span>
      </div>
      <ion-icon class="end-icon" name="chevron-forward-outline"></ion-icon>
    </div>

    <div
      class="menu-row"
      tabindex="0"
      (keydown.enter)="goTo('notification-settings')"
      (click)="goTo('notification-settings')"
    >
      <div class="right">
        <ion-icon name="notifications-outline"></ion-icon>
        <span>Notification settings</span>
      </div>
      <ion-icon class="end-icon" name="chevron-forward-outline"></ion-icon>
    </div>

    <div
      class="menu-row"
      tabindex="0"
      (keydown.enter)="goTo('security')"
      (click)="goTo('security')"
    >
      <div class="right">
        <ion-icon src="/logo/password.svg"></ion-icon>
        <span>Security settings</span>
      </div>
      <ion-icon class="end-icon" name="chevron-forward-outline"></ion-icon>
    </div>

    <div
      class="menu-row"
      tabindex="0"
      (keydown.enter)="goTo('referral')"
      (click)="goTo('referral')"
    >
      <div class="right">
        <ion-icon name="gift-outline"></ion-icon>
        <span>Refer a friend</span>
      </div>
      <ion-icon class="end-icon" name="chevron-forward-outline"></ion-icon>
    </div>
  </div>
</ion-content>
