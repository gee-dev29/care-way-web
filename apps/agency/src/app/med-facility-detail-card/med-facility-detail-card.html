<div class="provider-card">
  <div class="provider-info">
    <div class="info-row">
      <ion-text class="label">Name</ion-text>
      <ion-text class="value">{{name()}}</ion-text>
    </div>
    <div class="info-row">
      <ion-text class="label">Email</ion-text>
      <ion-text class="value">{{email()}}</ion-text>
    </div>
    <div class="info-row">
      <ion-text class="label">Phone Number</ion-text>
      <ion-text class="value">
        <span class="value">{{location()}}</span>
      </ion-text>
    </div>
  </div>
</div>
