<ion-content id="background-content" fullscreen>
  @if (loaded) {

  <div class="page-header">
    <ion-icon src="/logo/backarrow.svg" (click)="goBack()"></ion-icon>
    <h2>Referral History</h2>
  </div>

  <div class="referral-list">
    @if((users$ | async)?.length ){ @for(users of (users$ | async); track
    $index) {

    <div class="referral-card">
      <div class="row">
        <p class="label">Name</p>
        <span class="label">Status</span>
      </div>
      <div class="row value">
        <span>{{users.firstName}} {{users.lastName}}</span>
        <span>{{users.status}}</span>
      </div>
    </div>
    } }
  </div>

  } @else {
  <div class="page-header">
    <ion-skeleton-text
      animated
      style="width: 40px; height: 20px"
    ></ion-skeleton-text>
    <ion-skeleton-text
      animated
      style="width: 140px; height: 20px"
    ></ion-skeleton-text>
  </div>

  <div class="referral-list">
    @for (i of [1,2,3,4]; track $index) {
    <div class="referral-card">
      <div class="row">
        <ion-skeleton-text
          animated
          style="width: 90px; height: 16px"
        ></ion-skeleton-text>
        <ion-skeleton-text
          animated
          style="width: 70px; height: 16px"
        ></ion-skeleton-text>
      </div>
      <div class="row value">
        <ion-skeleton-text
          animated
          style="width: 120px; height: 18px"
        ></ion-skeleton-text>
        <ion-skeleton-text
          animated
          style="width: 90px; height: 18px"
        ></ion-skeleton-text>
      </div>
    </div>
    }
  </div>

  }
</ion-content>
