<ion-content id="background-content" class="ion-padding" [fullscreen]="true">
  <ui-wallet-withdraw
    (back)="navigateTo()"
    [balance]="balance"
    (initiateWithdrawal)="initiateWithdrawal($event)"
    (bankAccountSelected)="selectBankAcct($event)"
    (addBank)="addBank()"
    [bankDetails]="bankDetails"
    [loading]="loading"
  >
  </ui-wallet-withdraw>
</ion-content>
