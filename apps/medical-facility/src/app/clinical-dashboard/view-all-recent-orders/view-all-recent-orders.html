<ion-content>
  <div class="page ion-padding">
    <div class="header">
      <ion-icon (click)="goBack()" name="chevron-back-outline"></ion-icon>
      <div class="title">Orders</div>
      <div></div>
    </div>

    <!-- <div class="search__wrapper">
      <ion-searchbar
        class="custom-searchbar"
        placeholder="Search patients"
      ></ion-searchbar>
    </div> -->
    <div class="chips-container">
      @for (status of statuses; track $index) {
      <ion-chip
        [outline]="selectedItem !== status"
        (click)="selectStatus(status)"
        [ngStyle]="{
  'background-color': selectedItem === status ? '#307D3D' : 'transparent',
  'color': selectedItem === status ? '#fff' : '#307D3D',
  'border-color': '#307D3D'
}"
      >
        {{ status }}
      </ion-chip>
      }
    </div>

    @for (item of allOrders; track $index) {
    <ui-fufil-card
      [bg]="'#f6f6f6'"
      [header]="false"
      (viewIt)="viewOneOrder(item)"
      [order]="item"
    >
    </ui-fufil-card>
    }@if (hasMore) {
    <ion-infinite-scroll [disabled]="!hasMore" (ionInfinite)="loadMore($event)">
      <ion-infinite-scroll-content
        loadingSpinner="crescent"
        loadingText="Loading more appointments..."
      ></ion-infinite-scroll-content>
    </ion-infinite-scroll>
    } @if (totalRecords === 0) {
    <div class="empty">You have no orders</div>
    }
  </div>
</ion-content>
