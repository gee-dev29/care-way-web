<ion-content id="background-content" fullscreen>
  @if (loaded){
    <div #tabs id="laboratory" class="ion-padding">
      <div class="left__wrapper">
        <div
          class="up"
          (keyup.enter)="goBack()"
          tabindex="0"
          role="button"
          (click)="goBack()"
        >
          <ion-icon class="left__arrow" name="left-arrow"></ion-icon>
        </div>
        <ion-text>Laboratory</ion-text>
      </div>
        <ion-card class="black small__curve">
          <ion-card-content>
            <div class="contentDetail">
              <div>
                <p class="heading">Patient Name</p>
                <h4 class="detail">Adefarati Joseph</h4>
              </div>
              <div>
                <p class="heading">Date</p>
                <h4 class="detail">Oct 20, 2025</h4>
              </div>
            </div>
          </ion-card-content>
        </ion-card>

      <div class="card__wrapper">
        <form>
          <ui-input
            [label]="'Lab Category'"
            [shouldSearch]="true"
            [isMultiselect]="false"
            [isClicked]="isCategory"
            [type]="'dropdown'"
            [options]="categories"
            (data)="isCategoryClicked()"
            (emitted)="offCategoryClicked()"
          ></ui-input>
          <ui-input
            [label]="'Test Name'"
            [shouldSearch]="true"
            [isMultiselect]="false"
            [isClicked]="isTestName"
            [type]="'dropdown'"
            [options]="testNames"
            (data)="isTestNameClicked()"
            (emitted)="offTestNameClicked()"
          ></ui-input>

          <div class="ui__button">
            <ui-button
              (Click)="next()"
              [label]="label"
              [disabled]="loading"
              [loading]="loading"
              [width]="'full'"
              [fill]="'solid'"
              [shape]="'round'"
              [backgroundColor]="'secondary'"
              [showImage]="false"
            ></ui-button>
          </div>
        </form>
        </div>
        <div class="end"></div>
    </div>
  } @else {
    <div #tabs id="laboratory" class="ion-padding">
      <div class="">
        <ion-skeleton-text
          [animated]="true"
          style="width: 100px; height: 15px;"
        ></ion-skeleton-text>
      </div>

      <div>
        <ion-skeleton-text
        class="small__curve"
        [animated]="true"
        style="width: 100%; height: 80px; margin-top: 30px"
      ></ion-skeleton-text>
      </div>
    </div>
  }
</ion-content>
