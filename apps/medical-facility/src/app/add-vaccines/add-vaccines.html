<div id="background-content">
  <div id="add__vaccines" class="ion-padding">
    <div
      class="up"
      (keyup.enter)="goBack()"
      tabindex="0"
      role="button"
      (click)="goBack()"
    >
      <ion-icon src="/logo/backarrow.svg"></ion-icon>
      <ion-text>Add Vaccines & Biologics</ion-text>
    </div>

    <div class="card__wrapper">
      <form [formGroup]="vaccineForm">
        <div class="input">
          <ui-input
            [label]="'Active Ingredient'"
            [shouldSearch]="true"
            [isMultiselect]="false"
            [isClicked]="isActiveIngredient"
            [type]="'dropdown'"
            [options]="activeIngredients"
            (data)="isActiveIngredientClicked()"
            (emitted)="offActiveIngredientClicked()"
            [selectedText]="vaccineForm.value.activeIngredient"
            [selectedItem]="[vaccineForm.value.activeIngrident]"
            [control]="activeIngredient"
          ></ui-input>
        </div>
        <div class="input">
          <ui-input
            [label]="'Form'"
            [shouldSearch]="true"
            [isMultiselect]="false"
            [isClicked]="isForm"
            [type]="'dropdown'"
            [options]="form"
            (data)="isFormClicked()"
            (emitted)="offFormClicked()"
            [selectedText]="vaccineForm.value.form"
            [selectedItem]="[vaccineForm.value.form]"
            [control]="formSelected"
          ></ui-input>
        </div>
        <div class="input">
          <ui-input
            [label]="'Frequency of Use'"
            [shouldSearch]="true"
            [isMultiselect]="false"
            [isClicked]="isFrequency"
            [type]="'dropdown'"
            [options]="frequency"
            (data)="isStrengthClicked()"
            (emitted)="offStrengthClicked()"
            [control]="frequencyOfUse"
            [selectedText]="vaccineForm.value.frequencyOfUse"
            [selectedItem]="[vaccineForm.value.frequencyOfUse]"
          ></ui-input>
        </div>
        <div class="input">
          <ui-input
            [label]="'Product Name'"
            [shouldSearch]="true"
            [isMultiselect]="false"
            [isClicked]="isProductName"
            [type]="'dropdown'"
            [options]="productNames"
            (data)="isProductNameClicked()"
            (emitted)="offProductNameClicked()"
            [selectedText]="vaccineForm.value.product"
            [selectedItem]="[vaccineForm.value.product]"
            [control]="productName"
          ></ui-input>
        </div>

        <ui-input [label]="'Strength'" [control]="strength"></ui-input>
        <div class="picker">
          <div class="tabs-container">
            <div class="tabs">
              @for(tab of tabs; track tab; let i = $index) {
              <ion-text
                class="tab"
                [class.active]="activeTabIndex === i"
                (click)="setTab(tab)"
              >
                {{ tab }}
              </ion-text>
              }
            </div>
          </div>
          @if (activeTabIndex === 0) {
          <ion-picker>
            <ion-picker-column
              [value]="duration"
              (ionChange)="onDayChange($event)"
            >
              @for (opt of dayOptions; track $index) {
              <ion-picker-column-option [value]="opt.value">
                {{ opt.label }}
              </ion-picker-column-option>
              }
            </ion-picker-column>
          </ion-picker>

          }@else if (activeTabIndex === 1) {

          <ion-picker>
            <ion-picker-column
              [value]="duration"
              (ionChange)="onMonthChange($event)"
            >
              @for (opt of monthOptions; track $index) {
              <ion-picker-column-option [value]="opt.value">
                {{ opt.label }}
              </ion-picker-column-option>
              }
            </ion-picker-column>
          </ion-picker>
          }
        </div>
        <div class="ui__button">
          <ui-button
            (Click)="next()"
            [label]="label"
            [disabled]="loading || (!vaccineForm.valid)"
            [loading]="loading"
            [width]="'full'"
            [fill]="'solid'"
            [shape]="'round'"
            [backgroundColor]="'#307d3d'"
            [showImage]="false"
          ></ui-button>
        </div>
      </form>

      <div class="end"></div>
    </div>
  </div>
</div>
