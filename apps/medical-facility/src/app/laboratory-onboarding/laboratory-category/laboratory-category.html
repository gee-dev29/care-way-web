<ion-content>
  <div class="page">
    <form class="ion-padding">
      <div class="header">
        @if(edit){
        <ion-icon (click)="goBack()" name="chevron-back-outline"></ion-icon>
        }
        <ion-text color="black">
          <h1>{{edit ? "Update" : "Onboard" }} Laboratory</h1>
          <span>Select your area of specialization.</span>
        </ion-text>
      </div>

      <div class="container">
        <ui-input
          [type]="'text'"
          [label]="'Facility Type Name'"
          [control]="name"
        ></ui-input>
        @for (item of categories; track $index) {
        <ion-card>
          <ion-card-content>
            <div
              class="left"
              tabindex=""
              (keyup.enter)="selectType(item, $index)"
              (click)="selectType(item, $index)"
            >
              <ion-text>{{item.text}}</ion-text>
              <ion-checkbox [checked]="item.check"></ion-checkbox>
            </div>
          </ion-card-content>
        </ion-card>
        }
      </div>
      <div class="bts">
        <ui-button
          [label]="label"
          [width]="'full'"
          [fill]="'solid'"
          [shape]="'round'"
          [loading]="loading"
          [backgroundColor]="'#307d3d'"
          [textColor]="'#FDFDFD'"
          [disabled]="!checkIfAnyIsEmpty() || !name.valid || loading"
          (Click)="proceed()"
        ></ui-button>
      </div>
    </form>
  </div>
</ion-content>
