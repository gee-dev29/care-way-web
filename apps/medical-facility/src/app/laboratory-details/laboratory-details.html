<ion-content id="background-content" fullscreen>
  @if (loaded){
    <div #tabs id="laboratory__details" class="ion-padding">
      <div class="top">
      <div class="left__wrapper">
        <div
          (keyup.enter)="goBack()"
          tabindex="0"
          role="button"
          (click)="goBack()"
        >
          <ion-icon class="left__arrow" name="left-arrow"></ion-icon>
        </div>
        <ion-text>Laboratory</ion-text>
      </div>
      <a routerLink="/laboratory" class="right">
        <ion-icon src="/icons/more.svg"></ion-icon>
        <ion-text>Add More</ion-text>
      </a>
      </div>
        <ion-card class="black small__curve">
          <ion-card-content>
            <div class="contentDetail">
              <div>
                <p class="heading">Patient Name</p>
                <h4 class="detail">Adefarati Joseph</h4>
              </div>
              <div>
                <p class="heading">Date</p>
                <h4 class="detail">Oct 20, 2025</h4>
              </div>
            </div>
          </ion-card-content>
        </ion-card>

        <ion-card class="card medium__curve">
          <ion-card-content>
            <div class="orderDetail">
              <div class="top">
                <p class="heading">Lab Category</p>
                <h4 class="">Microbiology</h4>
              </div>
              <div class="top">
                <p class="heading">Test Name</p>
                <h4 class="">Urine</h4>
              </div>
            </div>
          </ion-card-content>
        </ion-card>

        <div class="end"></div>
    </div>
  } @else {
    <div #tabs id="laboratory__details" class="ion-padding">
      <div class="top">
        <ion-skeleton-text
          class="left__wrapper"
          [animated]="true"
          style="width: 100px; height: 15px;"
        ></ion-skeleton-text>
        <ion-skeleton-text
          class="right"
          [animated]="true"
          style="width: 100px; height: 15px;"
        ></ion-skeleton-text>
      </div>

      <div>
        <ion-skeleton-text
        class="small__curve"
        [animated]="true"
        style="width: 100%; height: 80px; margin-top: 25px"
      ></ion-skeleton-text>
      </div>

      <div>
        <ion-skeleton-text
        class="medium__curve"
        [animated]="true"
        style="width: 100%; height: 100px; margin-top: 25px"
      ></ion-skeleton-text>
      </div>
    </div>
  }
</ion-content>
