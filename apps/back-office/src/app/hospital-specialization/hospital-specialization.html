<ui-page-body>
  <div class="table__head">
    <h2 class="title">Hospital Specializations</h2>
    <ui-desktop-button
      [label]="'Add Specialization'"
      [size]="'large'"
      [primary]="true"
      (Click)="showAdd()"
    ></ui-desktop-button>
  </div>
  <div class="mt-1">
    <p-table
      #dt1
      dataKey="id"
      [paginator]="true"
      [rows]="20"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[20, 50, 100]"
      [value]="hospitalSpecialization$ | async"
    >
      <ng-template #header>
        <tr>
          <th>Name</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr>
          <td>{{item.name}}</td>
          <td>
            <ui-desktop-button
              [size]="'small'"
              [label]="'Edit'"
              [primary]="true"
              (Click)="edit(item)"
            ></ui-desktop-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</ui-page-body>
<ui-modal
  [header]="selectedId ? 'Edit Hospital Specialization' : 'Add Hospital Specialization'"
  #modal
  [(visibility)]="addModal"
  [selectedWidth]="'40vw'"
>
  <div class="modal__container">
    <div class="input">
      <form class="mb-2" [formGroup]="form">
        <ui-desktop-input
          [label]="'Specialization'"
          [control]="specialization"
        ></ui-desktop-input>
      </form>
      <ui-desktop-button
        [primary]="true"
        [disabled]="!form.valid"
        [label]="selectedId ? 'Save' : 'Add'"
        [width]="'full'"
        (click)="selectSpecialization()"
      ></ui-desktop-button>
    </div>
  </div>
</ui-modal>
