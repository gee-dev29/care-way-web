<ui-page-body>
  <div class="table__head">
    <h2 class="title">App Versions</h2>
    <ui-desktop-button
      [label]="'Add Version'"
      [size]="'large'"
      [primary]="true"
      (Click)="showAdd()"
    ></ui-desktop-button>
  </div>
  <div class="mt-1">
    <p-table
      #dt1
      dataKey="id"
      [paginator]="true"
      [rows]="20"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[20, 50, 100]"
      [value]="appVersion$ | async"
    >
      <ng-template #header>
        <tr>
          <th>App Name</th>
          <th>Android Version</th>
          <th>Ios Version</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr>
          <td>{{item.appName}}</td>
          <td>{{item.androidVersionNumber}}</td>
          <td>{{item.iosVersionNumber}}</td>
          <td>
            <ui-desktop-button
              [size]="'small'"
              [label]="'Edit'"
              [primary]="true"
              (Click)="edit(item)"
            ></ui-desktop-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</ui-page-body>
<ui-modal
  [header]="editVersion ? 'Edit Hospital Specialization' : 'Add Hospital Specialization'"
  #modal
  [(visibility)]="addModal"
  [selectedWidth]="'40vw'"
>
  <div class="modal__container">
    <div class="input">
      <form class="mb-2" [formGroup]="form">
        <ui-input-drop-down
          [label]="'App Name'"
          [control]="appName"
          [options]="appNames"
          [key]="'text'"
          [value]="'value'"
        ></ui-input-drop-down>
        <ui-desktop-input
          [label]="'Android Version'"
          [control]="androidVersionNumber"
        ></ui-desktop-input>
        <ui-desktop-input
          [label]="'Ios Version'"
          [control]="iosVersionNumber"
        ></ui-desktop-input>
      </form>
      <ui-desktop-button
        [primary]="true"
        [disabled]="!form.valid"
        [label]="editVersion ? 'Update' : 'Add'"
        [width]="'full'"
        (click)="proceed()"
      ></ui-desktop-button>
    </div>
  </div>
</ui-modal>
