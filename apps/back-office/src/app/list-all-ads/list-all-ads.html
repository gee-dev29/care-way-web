<ui-page-body>
  <div class="table__head">
    <h2 class="title">Ads</h2>
    <div class="grouped__btn">
      <ui-desktop-button
        [label]="'Create Ad'"
        [size]="'large'"
        [primary]="true"
        (Click)="createAd()"
      ></ui-desktop-button>
      <ui-desktop-button
        [disabled]="selected.size === 0"
        [label]="'Initiate Approval' + ' (' + selected.size + ')'"
        [primary]="true"
        [size]="'large'"
        (Click)="openBulkApprovalConfirmationModal()"
      ></ui-desktop-button>
    </div>
  </div>
  <div class="mt-1">
    <p-table
      #dt1
      dataKey="advertId"
      [lazy]="true"
      [paginator]="true"
      [rows]="20"
      [totalRecords]="totalRecords"
      [value]="ads$ | async"
      [(selection)]="selectedAds"
      (onLazyLoad)="load($event)"
      [rowsPerPageOptions]="[20, 50, 100]"
      [tableStyle]="{'min-width': '100vw'}"
      (onRowSelect)="onRowSelect($event)"
      (onRowUnselect)="onRowUnselect($event)"
      (onHeaderCheckboxToggle)="onHeaderCheckboxToggle({$event, dt1})"
    >
      <ng-template #header>
        <tr>
          <th style="width: 5rem">
            <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
          </th>
          <th>Ad Owner</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Audience</th>
          <th>Status</th>
          <th></th>
          <th></th>
        </tr>
        <tr>
          <th></th>
          <th></th>
          <th>
            <p-columnFilter [showMenu]="false" type="date" field="date">
              <ng-template
                pTemplate="filter"
                let-value
                let-filter="filterCallback"
              >
                <p-datepicker
                  [ngModel]="value"
                  [readonlyInput]="true"
                  [showClear]="true"
                  [iconDisplay]="'input'"
                  (ngModelChange)="filterByDate($event)"
                  inputId="dateFilter"
                  dateFormat="dd-mm-yy"
                />
              </ng-template>
            </p-columnFilter>
          </th>
          <th></th>
          <th></th>
          <th></th>
          <th></th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr>
          <td style="width: 5rem">
            <p-tableCheckbox
              [disabled]="item.status !== 'Draft' && item.status !== 'Rejected'"
              [value]="item"
            ></p-tableCheckbox>
          </td>
          <td>{{ item.adOwner }}</td>
          <td>
            {{ moment.utc(`${item.startDate}`).local().format('MMM DD, YYYY') }}
          </td>
          <td>{{ getEndDate(item.startDate, item.durationInDays) }}</td>
          <td>{{ item.audience }}</td>
          <td>{{ item.status }}</td>
          <td></td>
          <td>
            <div class="grouped__btn">
              <ui-desktop-button
                [label]="'View'"
                [primary]="true"
                [size]="'small'"
                (Click)="view(item)"
              ></ui-desktop-button>
              <ui-desktop-button
                class="delete"
                [label]="'Delete'"
                [primary]="false"
                [size]="'small'"
                (Click)="showDeleteModal(item)"
              ></ui-desktop-button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7">
            <div class="empty__table__text">There are no Ads yet</div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</ui-page-body>

<ui-confirmation-modal-desktop
  [message]="'Are you sure you want to delete this Advert?'"
  [(visibility)]="isAdvertModal"
  (proceed)="delete()"
>
</ui-confirmation-modal-desktop>
<ui-confirmation-modal-desktop
  [(visibility)]="bulkApprovalInitiationConfirmationModal"
  (proceed)="approve()"
  [message]="bulkApprovalMessage"
></ui-confirmation-modal-desktop>
