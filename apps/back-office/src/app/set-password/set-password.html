<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<ui-authentication title="Set Your Password!" leftImage="/images/signin.svg">
  <form [formGroup]="form">
    <ui-input
      [type]="'password'"
      [label]="'Password'"
      [control]="password"
      (focused)="onPasswordFocus()"
      (ionInput)="onPasswordInput()"
    ></ui-input>
    <ui-input
      [type]="'password'"
      [label]="'Confirm Password'"
      [control]="confirmPassword"
      (focused)="onPasswordFocus()"
      (ionInput)="onPasswordInput()"
    ></ui-input>
    @if (showPasswordRules) {
    <div class="mt-2 mb-2">
      <ion-text class="password-rules">
        <p>
          Make sure your password has 8 or more characters and has the
          following:
        </p>
        <ul class="pl-2">
          <li [class.valid]="passwordRules.uppercase">An uppercase letter</li>
          <li [class.valid]="passwordRules.lowercase">A lowercase letter</li>
          <li [class.valid]="passwordRules.number">A number</li>
          <li [class.valid]="passwordRules.specialChar">A Symbol</li>
        </ul>
      </ion-text>
    </div>
    }
    <div class="bts">
      <ui-button
        [label]="'Proceed'"
        [width]="'full'"
        [fill]="'solid'"
        [shape]="'round'"
        [loading]="loading"
        [disabled]="loading || !form.valid || !passwordsMatch"
        [backgroundColor]="'#307d3d'"
        [textColor]="'#FDFDFD'"
        (Click)="proceed()"
      ></ui-button>
    </div>
  </form>
</ui-authentication>
