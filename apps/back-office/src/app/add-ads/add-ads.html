<ui-page-body>
  <div class="page">
    <div class="table__head">
      <div class="grouped__btn">
        <img
          class="left-arrow-icon"
          tabindex=""
          (keyup.enter)="back()"
          (click)="back()"
          src="icons/left-arrow-black.svg"
          alt=""
        />
        <h2 class="title">{{ isEditMode ? 'Edit Ad' : 'Create Ad' }}</h2>
      </div>
    </div>
    <form [formGroup]="form">
      <ui-form-body [columns]="'split'" class="form__body">
        <ui-desktop-input
          [type]="'text'"
          [label]="'Ad Owner'"
          [control]="adOwner"
          [size]="'small'"
        ></ui-desktop-input>
        <ui-desktop-input
          [type]="'text'"
          [label]="'Destination URL'"
          [control]="destinationUrl"
          [size]="'small'"
        ></ui-desktop-input>
        <ui-desktop-input
          [type]="'number'"
          [label]="'Duration(days)'"
          [control]="durationDays"
          [size]="'large'"
        ></ui-desktop-input>
        <ui-input-drop-down
          [label]="'Audience'"
          [control]="audience"
          [options]="audiences"
          [key]="'text'"
          [value]="'value'"
        ></ui-input-drop-down>
      </ui-form-body>
      <ui-form-body [columns]="'split'" class="form__body">
        <ui-date-input [label]="'Date'" [control]="startDate"></ui-date-input>
      </ui-form-body>
      <ui-form-body [columns]="'split'" class="form__body">
        <ui-upload-box
          [label]="'Mobile (Recommended: 1200 x 628 px)'"
          [imageUrl]="getAsset(advertDevice.Mobile)"
          [imageName]="getAssetName(advertDevice.Mobile)"
          (fileDeleted)="onMobileLogoDeleted()"
          (fileSelected)="onMobileLogoSelected($event)"
        ></ui-upload-box>
        <ui-upload-box
          [label]="'Tablet (Recommended: 1600 x 900 px)'"
          [imageUrl]="getAsset(advertDevice.Tablet)"
          [imageName]="getAssetName(advertDevice.Tablet)"
          (fileSelected)="onTabletLogoSelected($event)"
          (fileDeleted)="onTabletLogoDeleted()"
        ></ui-upload-box>
        <ui-upload-box
          [label]="'Desktop ( Recommended: 1920 x 1080 px)'"
          [imageUrl]="getAsset(advertDevice.Desktop)"
          [imageName]="getAssetName(advertDevice.Desktop)"
          (fileSelected)="onDesktopLogoSelected($event)"
          (fileDeleted)="onDesktopLogoDeleted()"
        ></ui-upload-box>
      </ui-form-body>
      <div class="grouped__btn">
        <ui-desktop-button
          [label]="saveLabel"
          [size]="'large'"
          [primary]="true"
          [loading]="loading"
          [disabled]="!form.valid || loading"
          (Click)="save()"
        ></ui-desktop-button>
      </div>
    </form>
  </div>
</ui-page-body>
