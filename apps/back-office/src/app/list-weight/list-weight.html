<div class="mt-1">
    <p-table
      #dt1
      dataKey="id"
      [paginator]="true"
      [rows]="20"
      [totalRecords]="totalRecords"
      [value]="weight$ | async"
      [rowsPerPageOptions]="[20, 50, 100]"
    >
      <ng-template #header>
        <tr>
          <th>Date</th>
          <th>Weight</th>
          <th>Status</th>
        </tr>
      </ng-template>
  
      <ng-template #body let-item>
        <tr>
          <td>{{ item.date | date }} ({{item.time}})</td>
          <td>{{ item.record}}</td>
          <td>{{ item.status }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
