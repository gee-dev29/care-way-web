<div class="mt-1">
  <p-table
    #dt1
    dataKey="id"
    [lazy]="true"
    [paginator]="true"
    [rows]="20"
    [totalRecords]="totalRecords"
    [value]="user$ | async"
    (onLazyLoad)="load($event)"
    [rowsPerPageOptions]="[20, 50, 100]"
  >
    <ng-template #header>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Phone Number</th>
        <th>Gender</th>
        <th></th>
      </tr>
      <tr>
        <th>
          <p-columnFilter
            type="text"
            field="firstName"
            [showMenu]="false"
          ></p-columnFilter>
        </th>
        <th>
          <p-columnFilter
            type="text"
            field="lastName"
            [showMenu]="false"
          ></p-columnFilter>
        </th>
        <th>
          <p-columnFilter
            type="text"
            field="email"
            [showMenu]="false"
          ></p-columnFilter>
        </th>
        <th>
          <p-columnFilter
            type="text"
            field="phone"
            [showMenu]="false"
          ></p-columnFilter>
        </th>
        <th></th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.firstName }}</td>
        <td>{{ item.lastName }}</td>
        <td>{{ item.email }}</td>
        <td>{{ item.phone }}</td>
        <td>{{ item.gender | titlecase}}</td>
        <td>
          <ui-desktop-button
            [label]="'View'"
            [primary]="true"
            [size]="'small'"
            (Click)="view(item)"
          ></ui-desktop-button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7">
          <div class="empty__table__text">There are no Details yet</div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
