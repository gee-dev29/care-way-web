<div class="mt-1">
  <p-table
    #dt1
    dataKey="id"
    [paginator]="true"
    [rows]="20"
    [totalRecords]="totalRecords"
    [value]="glucose$ | async"
    [rowsPerPageOptions]="[20, 50, 100]"
  >
    <ng-template #header>
      <tr>
        <th>Date</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td>{{ item.date | date }} ({{item.time}})</td>
        <td>
          <ui-desktop-button
            [label]="'View'"
            [primary]="true"
            (Click)="openGlucoseModal(item)"
          ></ui-desktop-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<ui-modal
  [(visibility)]="glucoseModal"
  [selectedWidth]="'30vw'"
  [header]="'Glucose Details'"
>
<div class="mt-1">
  <p-table
    #dt1
    dataKey="id"
    [paginator]="true"
    [rows]="20"
    [totalRecords]="totalRecords"
    [value]="vitalRecordId?.readings"
    [rowsPerPageOptions]="[20, 50, 100]"
  >
    <ng-template #header>
      <tr>
        <th>Date</th>
        <th>Time</th>
        <th>Record</th>
        <th>Testing Type</th>
        <th>Status</th>
      </tr>
    </ng-template>

    <ng-template #body let-reading>
      <tr>
        <td>{{ vitalRecordId.date | date }}</td>
        <td>{{ vitalRecordId.time }}</td>
        <td>{{ reading.record }}</td>
        <td>{{ reading.testingType }}</td>
        <td>{{ reading.status }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
</ui-modal>
