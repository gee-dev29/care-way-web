<ui-page-body>
  <div class="table__head">
    <h2 class="title">Medical Facilities</h2>
    <div class="grouped__btn">
      <ui-desktop-button
        [label]="'Onboard Facility'"
        [size]="'large'"
        [primary]="true"
        (Click)="onboardFacility()"
      ></ui-desktop-button>
      <ui-desktop-button
        [label]="'Export'"
        [size]="'large'"
        [primary]="true"
        (Click)="export()"
      ></ui-desktop-button>
    </div>
  </div>
  <div class="mt-1">
    <p-table
      #dt1
      dataKey="id"
      [lazy]="true"
      [paginator]="true"
      [rows]="20"
      [totalRecords]="totalRecords"
      [value]="medicalFacilities$ | async"
      (onLazyLoad)="load($event)"
      [rowsPerPageOptions]="[20, 50, 100]"
    >
      <ng-template #header>
        <tr>
          <th>Name</th>
          <th>Phone Number</th>
          <th>Email</th>
          <th>Country</th>
          <th></th>
        </tr>
        <tr>
          <th>
             <p-columnFilter
            type="text"
            field="name"
            [showMenu]="false"
          ></p-columnFilter>
          </th>
          <th> <p-columnFilter
            type="text"
            field="phoneNumber"
            [showMenu]="false"
          ></p-columnFilter></th>
          <th>
             <p-columnFilter
            type="text"
            field="email"
            [showMenu]="false"
          ></p-columnFilter>
          </th>
          <th></th>
          <th></th>
        </tr>
      </ng-template>

      <ng-template #body let-item>
        <tr>
          <td>{{ item.name }}</td>
          <td>{{ item.phoneNumber }}</td>
          <td>{{ item.email }}</td>
          <td>{{ item.country }}</td>
          <td>
            <ui-desktop-button
              [label]="'View'"
              [primary]="true"
              (Click)="view(item)"
            ></ui-desktop-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</ui-page-body>
