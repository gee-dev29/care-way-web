<div class="mt-1">
  <p-table
    #dt1
    dataKey="id"
    [lazy]="true"
    [paginator]="true"
    [rows]="20"
    [totalRecords]="totalRecords"
    [value]="members$ | async"
    (onLazyLoad)="load.emit($event)"
    [rowsPerPageOptions]="[20, 50, 100]"
    [tableStyle]="{ 'min-width': '80rem' }"
  >
    <ng-template #header>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Phone Number</th>
        <th>Gender</th>
        <th>Relationship</th>
        <th>Date of Birth</th>
        <th>Blood Group</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td>{{ item.firstName }}</td>
        <td>{{ item.lastName }}</td>
        <td>{{ item.email }}</td>
        <td>{{ item.phone }}</td>
        <td>{{ item.gender | titlecase}}</td>
        <td>{{ item.relationship}}</td>
        <td>{{ item.dob | date}}</td>
        <td>{{ item.bloodGroup}}</td>
        <td>
          <!-- <ui-desktop-button
            [label]="'View'"
            [primary]="true"
            (Click)="view(item)"
          ></ui-desktop-button> -->
          <ui-desktop-button
            [label]="'View'"
            [primary]="true"
          ></ui-desktop-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
