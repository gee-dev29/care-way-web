

<ion-content>
    <ion-header id="prescription">
  <div class="up">
    <ion-icon
      name="chevron-back-outline"
      size="small"
      (click)="cancel()"
    ></ion-icon>

    <ion-text class="address" color="black">Personal information</ion-text>
  </div>
</ion-header>
  <form class="form-wrapper" [formGroup]="form">
    <ui-input
      label="First name"
      type="text"
      [control]="firstName"
    ></ui-input>

    <ui-input
      label="Last name"
      type="text"
      [control]="lastName"
    ></ui-input>

    <ui-input
      label="Phone number"
      type="phone"
      [control]="phone"
    ></ui-input>

    <ui-input
      label="Email"
      type="email"
      [readOnly]="true"
      [control]="email"
    ></ui-input>
  </form>

  <div class="bts">
    <ui-button
      label="Save"
      width="full"
      fill="solid"
      shape="round"
      backgroundColor="#307d3d"
      textColor="#FDFDFD"
      [loading]="loading"
      [disabled]="!form.valid"
      (Click)="save()"
    ></ui-button>
  </div>
</ion-content>
