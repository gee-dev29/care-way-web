<ion-content fullscreen class="auth-content">
  <div class="page" [ngStyle]="bgColor ? {'background-color': bgColor} : null">
    <div class="center">
      <ion-img src="/logo/healbridge.svg" alt="HealBridge"></ion-img>
    </div>
    <form class="ion-padding" [formGroup]="form">
      <ion-text color="black">
        <p class="label"><b>Set Password</b></p>
      </ion-text>
      <div>
        <ui-input
          [type]="'password'"
          [label]="'Password'"
          [control]="password"
          (focused)="onPasswordFocus()"
          (blurred)="onPasswordBlur()"
          (ionInput)="onPasswordInput()"
        ></ui-input>
        <ui-input
          [type]="'password'"
          [label]="'Confirm Password'"
          [control]="confirmPassword"
          (focused)="onPasswordFocus()"
          (blurred)="onPasswordBlur()"
          (ionInput)="onPasswordInput()"
        ></ui-input>
        @if (showPasswordRules) {
        <ion-text class="password-rules">
          <p>
            Make sure your password is 8 or more characters and has the
            following:
          </p>
          <ul>
            <li [class.valid]="passwordRules.uppercase">An uppercase letter</li>
            <li [class.valid]="passwordRules.lowercase">A lowercase letter</li>
            <li [class.valid]="passwordRules.number">A number</li>
            <li [class.valid]="passwordRules.specialChar">A Symbol</li>
          </ul>
        </ion-text>
        }
      </div>
      <div class="bts">
        <ui-button
          (mousedown)="isProceeding = true"
          [label]="label"
          [width]="'full'"
          [fill]="'solid'"
          [shape]="'round'"
          [backgroundColor]="'#307d3d'"
          [textColor]="'#FDFDFD'"
          (Click)="proceed()"
          [disabled]="loading || !form.valid || !passwordsMatch"
          [loading]="loading"
        ></ui-button>
      </div>
      <!-- <ion-text color="black">
        <p class="label2 mv_down">
          No Need?
          <a href="/login" class="cursor"><b>Login</b></a>
        </p>
      </ion-text> -->
    </form>
  </div>
</ion-content>
