<ion-content id="prescription" class="no-bottom-space" [fullscreen]="true">
  <div class="up">
    <div class="header">
      <div class="sub-head">
        <ion-icon (click)="goBack()" name="chevron-back-outline"></ion-icon>
        <ion-text>Symptoms</ion-text>
      </div>
      <p>Keep Track of How You Feel</p>
    </div>

    <form [formGroup]="form" class="full-field">
      <div class="date-picker">
        <ion-text class="date-title">Select Date</ion-text>

        <div class="picker">
          <ui-date-picker [control]="dateControl"></ui-date-picker>
        </div>
      </div>
      <div class="date-picker">
        <ion-text class="date-title">Select Time</ion-text>

        <div class="picker">
          <ui-time-picker [control]="timeControl"></ui-time-picker>
        </div>
      </div>
      <div class="date-picker">
        <ion-text class="date-title"
          >At least how many days have you had this symptom?</ion-text
        >

        <div class="picker">
          <ion-picker>
            <ion-picker-column
              name="range"
              [value]="rangeValue"
              (ionChange)="onRangeChange($event)"
            >
              @for (opt of rangeOptions; track opt.value) {
              <ion-picker-column-option [value]="opt.value">
                {{ opt.label }}
              </ion-picker-column-option>
              }
            </ion-picker-column>
          </ion-picker>
        </div>
      </div>

      <div class="select-body">
        <ui-input
          label="Select body Part"
          [control]="bodyPartControl"
          [options]="options"
          [selectedText]="form.value.bodyPartControl"
          [shouldSearch]="true"
          [isMultiselect]="false"
          [isClicked]="isSymptoms"
          [type]="'dropdown'"
          (data)="isSymptomsClicked()"
          (emitted)="offSymptomsClicked()"
        >
        </ui-input>
      </div>

      <div>
        <ui-input-textarea
          [control]="description"
          [placeholder]="'Recent or new symptom — started within the past few days.'"
          [label]="'Description of Symptoms'"
        >
        </ui-input-textarea>
      </div>
    </form>

    <div class="btn-container">
      <ui-button
        [label]="'Next'"
        [width]="'full'"
        [fill]="'solid'"
        [shape]="'round'"
        [backgroundColor]="'#307d3d'"
        [textColor]="'#FDFDFD'"
        [disabled]="!form.valid"
        [loading]="loading"
        (Click)="continue()"
      ></ui-button>
    </div>
  </div>
</ion-content>
