<ion-content fullscreen class="auth-content">
  <div class="page" [ngStyle]="bgColor ? {'background-color': bgColor} : null">
    <div class="page-inner">
      <div class="center">
        <ion-img src="/logo/healbridge.svg" alt="HealBridge"></ion-img>
      </div>
       <form class="ion-padding" [formGroup]="form">
    <ion-text color="black">
      <p class="label"><b>Reset Password</b></p>
    </ion-text>
    <div>
      <ui-input
        [control]="identity"
        [type]="'email'"
        [label]="'Email'"
      ></ui-input>
    </div>
    <div class="bts">
      <ui-button
        [label]="'Get OTP'"
        [width]="'full'"
        [fill]="'solid'"
        [shape]="'round'"
        [loading]="loading"
        [disabled]="loading || (!form.valid)"
        [backgroundColor]="'#307d3d'"
        [textColor]="'#FDFDFD'"
        (Click)="routeTo()"
      ></ui-button>
    </div>
    <ion-text color="black">
      <p class="label2 mv_down">
        No Need?
        <a routerLink="/login" class="cursor"><b>Login</b></a>
      </p>
    </ion-text>
  </form>
    </div>
  </div>
</ion-content>
