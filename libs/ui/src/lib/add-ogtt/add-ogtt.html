<ion-content
  id="background-content"
  class="no-bottom-space"
  [fullscreen]="true"
>
  <div class="padding">
    <ion-header id="prescription">
      <div class="pricing-head">
        <ion-icon
          (click)="cancel()"
          name="chevron-back-outline"
          size="small"
        ></ion-icon>
        <ion-text class="pricing-title">Add OGTT</ion-text>
      </div>
    </ion-header>

    <ion-list>
      <p class="date">Select Date</p>
      <ui-date-picker [control]="date"></ui-date-picker>
      <p class="date two">Select Time 1</p>
      <ui-time-picker [control]="time "></ui-time-picker>

      <div class="height-box">
        <p class="date two">Record 1</p>
        <ion-text>mg/dL</ion-text>
        <ion-picker>
          <ion-picker-column
            [value]="recordOne"
            (ionChange)="onIonChange($event)"
          >
            @for (opt of options; track opt.value) {
            <ion-picker-column-option [value]="opt.value">
              {{ opt.label }}
            </ion-picker-column-option>
            }
          </ion-picker-column>
        </ion-picker>
      </div>
      <div class="height-box">
        <p class="date two">Record 2</p>
        <ion-text>mg/dL</ion-text>
        <ion-picker>
          <ion-picker-column
            [value]="recordTwo"
            (ionChange)="onIonChangeTwo($event)"
          >
            @for (opt of options; track opt.value) {
            <ion-picker-column-option [value]="opt.value">
              {{ opt.label }}
            </ion-picker-column-option>
            }
          </ion-picker-column>
        </ion-picker>
      </div>

      <div class="bts">
        <ui-button
          [label]="'Save'"
          [width]="'full'"
          [fill]="'solid'"
          [shape]="'round'"
          [backgroundColor]="'#307d3d'"
          [textColor]="'#FDFDFD'"
          [loading]="loading"
          [disabled]="!form.valid"
          (Click)="save()"
        ></ui-button>
      </div>
    </ion-list>
  </div>
</ion-content>
