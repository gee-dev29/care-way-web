<ion-content
  id="background-content"
  class="no-bottom-space"
  [fullscreen]="true"
>
  <div class="padding">
    <ion-header id="prescription" [style.margin-top.px]="module ? 70 : 20">
      <div class="pricing-head">
        <ion-icon
          (click)="cancel()"
          name="chevron-back-outline"
          size="small"
        ></ion-icon>
        <ion-text class="pricing-title">Add Height Record</ion-text>
      </div>
    </ion-header>

    <ion-list>
      @if(module){
      <p class="date">Select Date</p>
      <ui-date-picker [control]="date"></ui-date-picker>
      <p class="date two">Select Time</p>
      <ui-time-picker [control]="time"></ui-time-picker>
      }
      <p  class="date height">Select Height</p>
      <div class="height-box">
        <ion-picker>
          <ion-picker-column
            name="feet"
            [value]="feetValue"
            (ionChange)="onFeetChange($event)"
          >
            @for (opt of options; track opt.value) {
            <ion-picker-column-option [value]="opt.value">
              {{ opt.label }}
            </ion-picker-column-option>
            }
          </ion-picker-column>

          <ion-picker-column name="dot" [value]="'.'" class="dot-column">
            <ion-picker-column-option value="."> . </ion-picker-column-option>
          </ion-picker-column>

          <ion-picker-column
            name="decimal"
            [value]="decimalValue"
            (ionChange)="onDecimalChange($event)"
          >
            @for (d of decimalOptions; track d) {
            <ion-picker-column-option [value]="d">
              {{ d }}
            </ion-picker-column-option>
            }
          </ion-picker-column>

          <ion-picker-column
            name="unit"
            [value]="unitValue"
            class="unit-column"
            (ionChange)="onUnitChange($event)"
          >
            <ion-picker-column-option value="m">
              {{unitValue}}
            </ion-picker-column-option>
          </ion-picker-column>
        </ion-picker>
      </div>

      <div class="bts">
        <ui-button
          [label]="'Save'"
          [width]="'full'"
          [fill]="'solid'"
          [shape]="'round'"
          [backgroundColor]="'#307d3d'"
          [textColor]="'#FDFDFD'"
          [disabled]="!form.valid"
          [loading]="loading"
          (Click)="save()"
        ></ui-button>
      </div>
    </ion-list>
  </div>
</ion-content>
