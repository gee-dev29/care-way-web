@if(doctorsList){
<div class="profile-container">
  <div class="profile-header">
    <ion-text class="profile-header-title">{{title}}</ion-text>
    <ion-text (click)="view.emit()" class="profile-header-view"
      ><p class="view-all" [style.color]="viewAllColor">View all</p></ion-text
    >
  </div>
  <ion-list class="ion-list">
    <div class="profile-group">
      @for(list of doctorsList; track list;){
      <div class="profile-content">
        @if (list.professionalUpload) {
        <ion-avatar class="avatar-border">
          <ion-img class="avatar" [src]="list?.professionalUpload"> </ion-img>
        </ion-avatar>
        } @else {
        <ion-avatar class="avatar-border text__avater">
          <span>{{list?.firstName[0]}}{{list?.lastName[0]}} </span>
        </ion-avatar>
        }
        <div>
          <ion-text class="profile-name block"> {{list?.firstName}} </ion-text>
          @if (list.cadre) {
          <ion-text class="profile-job"> ({{list?.cadre}}) </ion-text>
          }
        </div>
      </div>
      }
      <div class="profile-content">
        <div class="profile-image2">
          <ion-icon
            (click)="onAddRecord()"
            src="/icons/plus-icon.svg"
            class="profile-img"
          ></ion-icon>
        </div>
        <div></div>
      </div>
    </div>
  </ion-list>
</div>
}@else{
<div class="profile-header">
  <ion-skeleton-text
    animated
    style="width: 40%; height: 20px"
  ></ion-skeleton-text>
  <ion-skeleton-text
    animated
    style="width: 20%; height: 20px"
  ></ion-skeleton-text>
</div>
<ion-list class="ion-list">
  <div class="profile-group">
    @for(i of [1,2,3,4]; track i) {
    <div class="profile-content">
      <ion-skeleton-text
        animated
        style="width: 50px; height: 50px; border-radius: 50%"
      ></ion-skeleton-text>
      <div class="flex-col" style="margin-left: 12px">
        <ion-skeleton-text
          animated
          style="width: 90px; height: 12px"
        ></ion-skeleton-text>
        <ion-skeleton-text
          animated
          style="width: 60px; height: 12px; margin-top: 8px"
        ></ion-skeleton-text>
      </div>
    </div>
    }
    <div class="profile-content">
      <ion-skeleton-text
        animated
        style="width: 50px; height: 50px; border-radius: 50%"
      ></ion-skeleton-text>
      <div style="margin-left: 12px">
        <ion-skeleton-text
          animated
          style="width: 40px; height: 12px"
        ></ion-skeleton-text>
        <ion-skeleton-text
          animated
          style="width: 80px; height: 12px; margin-top: 8px"
        ></ion-skeleton-text>
      </div>
    </div>
  </div>
</ion-list>
}
