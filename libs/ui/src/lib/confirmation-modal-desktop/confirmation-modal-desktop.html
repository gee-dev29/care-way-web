<p-dialog
  [(visible)]="visibility"
  [modal]="true"
  [style]="{ width: '30vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="close()"
  [focusOnShow]="false"
>
  <div class="modal">
    <i class="pi pi-question-circle" data-icon="warning"></i>
    <div class="warning">{{ message }}</div>
    <div class="grouped__btn">
      <ui-desktop-button
        [label]="'No'"
        [size]="'large'"
        (Click)="close()"
      ></ui-desktop-button>
      <ui-desktop-button
        [label]="'Yes'"
        [size]="'large'"
        [primary]="true"
        (Click)="continue()"
        [loading]="loading"
      ></ui-desktop-button>
    </div>
  </div>
</p-dialog>
