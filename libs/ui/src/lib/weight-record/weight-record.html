<ion-content
  id="background-content"
  id="background-content"
  class="no-bottom-space"
  [fullscreen]="true"
>
  <div id="prescription" class="ion-padding">
    <ui-vital-records-card
      title="Record Vitals"
      [showShare]="true"
      cardTitle="Weight"
      subtitle="Summary"
      cardIcon="/logo/blood-pressure.svg"
      [tabs]="['History','Tracker']"
      [tabContents]="[history, tracker]"
      [label]="'Add Weight'"
      [records$]="records$"
      (continue)="addWeight()"
      [vitalSignType]="vitalSignType.Weight"
      [storageService]="storageService"
    >
      <div left class="summary-temp">
        @if ((records$ | async); as records) {
        <ion-text class="summary-atitle"> kg </ion-text>

        <ion-text class="degree"> {{records[0]?.record}} </ion-text>}
      </div>

      <ng-container>
        <ng-template #tracker>
          <p>✅ Weight Content</p>
        </ng-template>

        <ng-template #history>
          @for ((item of records$ | async); track item) {
          <ion-card class="temp-card">
            <ion-card-content>
              <div class="row">
                <div>
                  <div class="row-title">
                    <div class="temperature">{{ item?.record }}</div>
                    <ion-badge class="status-badge black" color="light"
                      >Kg</ion-badge
                    >
                  </div>
                  <div class="range">{{item?.range}}</div>
                </div>

                <div class="status-col">
                  <ion-badge
                    class="status-badge white"
                    [style.background-color]="item.color"
                    >{{ item?.status }}</ion-badge
                  >
                  <div class="date">
                    {{newDateFormat( item?.date, item?.time) }}
                  </div>
                </div>
              </div>
            </ion-card-content>
          </ion-card>
          }
        </ng-template>
      </ng-container>
    </ui-vital-records-card>
  </div>
</ion-content>
